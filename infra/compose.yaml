services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office
      POSTGRES_DB: office
    ports:
      - "5433:5432"
    volumes:
      - office-pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Remote worker (fake runtime by default). Needs the API on API_HOST=0.0.0.0.
  # First start: OFFICE_REMOTE_ENROLL_TOKEN=<token from POST /workers> pnpm worker:remote
  worker-remote:
    profiles: ["remote"]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      OFFICE_API_URL: ws://host.docker.internal:4000
      OFFICE_WORKER_HOME: /office-worker
      OFFICE_WORKER_CAN_CLONE: "true"
      OFFICE_WORKSPACE_ROOTS: ""
      OFFICE_RUNTIME: ${OFFICE_REMOTE_RUNTIME:-fake}
      OFFICE_WORKER_NAME: ${OFFICE_REMOTE_WORKER_NAME:-remote-1}
      OFFICE_WORKER_TAGS: remote
      OFFICE_ENROLL_TOKEN: ${OFFICE_REMOTE_ENROLL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - office-worker-remote:/office-worker
volumes:
  office-pg:
  office-worker-remote:
